[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-review"
dynamic = ["version"]
description = "CLI for running security scanners over a codebase"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.9,<3"]

[project.scripts]
secure-review = "secure_review.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.dynamic]
version = { attr = "secure_review.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# Developer setup
# ---------------
#   python -m venv .venv
#   source .venv/Scripts/activate    # Git Bash on Windows; .venv/bin/activate on Linux/macOS
#   pip install -e ".[test]"
#
# Security scanners (bandit, semgrep, pip-audit, ...) are expected to be
# installed separately; they are not bundled with this package.
